name: infra

on:
  pull_request:
    branches: [main]
    paths: ['infra/terraform/**']
  push:
    branches: [main]
    paths: ['infra/terraform/**']
  workflow_dispatch:
    inputs:
      environment:
        description: environment
        default: dev
        required: true
      apply:
        description: apply changes
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_VAR_entra_tenant_id:    ${{ secrets.ENTRA_TENANT_ID }}
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform init -backend-config=backends/${{ env.ENV }}.tfvars
      - run: terraform validate
      - run: terraform plan -var-file=environments/${{ env.ENV }}.tfvars -out=tfplan
      - uses: actions/upload-artifact@v4
        with: { name: tfplan-${{ env.ENV }}, path: infra/terraform/tfplan, retention-days: 7 }

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}   # gate via GitHub Environments (approval)
    env:
      ENV: ${{ github.event.inputs.environment }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_VAR_entra_tenant_id:    ${{ secrets.ENTRA_TENANT_ID }}
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform init -backend-config=backends/${{ env.ENV }}.tfvars
      - run: terraform apply -auto-approve -var-file=environments/${{ env.ENV }}.tfvars
