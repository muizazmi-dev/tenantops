name: images

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'apps/web/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}          # e.g. tenantopsdevacrxxxxxx
  REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: identity-api
            context: .
            dockerfile: services/identity-api/Dockerfile
          - name: tenant-api
            context: .
            dockerfile: services/tenant-api/Dockerfile
          - name: core-api
            context: .
            dockerfile: services/core-api/Dockerfile
          - name: ai-orchestrator
            context: .
            dockerfile: services/ai-orchestrator/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/tenantops/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/tenantops/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
