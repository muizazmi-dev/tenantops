name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Restore
        run: dotnet restore services/TenantOps.sln
      - name: Build
        run: dotnet build services/TenantOps.sln -c Release --no-restore
      - name: Test
        run: dotnet test services/TenantOps.sln -c Release --no-build --logger "trx;LogFileName=test.trx"
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: dotnet tests
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci || npm install --no-audit --no-fund
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test --if-present

  sql-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Basic SQL syntax check
        run: |
          for f in infra/sql/migrations/*.sql infra/sql/seed/*.sql; do
            grep -n 'GO' "$f" >/dev/null || { echo "missing GO in $f"; exit 1; }
          done

  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - name: terraform fmt check
        run: terraform -chdir=infra/terraform fmt -check -recursive
